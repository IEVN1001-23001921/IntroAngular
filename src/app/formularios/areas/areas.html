<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="raw">
           <div class="col-6">
             <form action="">
                <div class="form-group pt-4">
                    <label for="num1">Anota tu base  o altura : </label>
                    <input [(ngModel)]="num1" name="num1" type="text" id="num1" class="form-control" placeholder="Ingrese numero 1">
                </div>
                <div class="form-group pt-4">

                    <label for="num2">Anota tu base  o altura :</label>
                    <input [(ngModel)]="num2" type="text" id="num2" name="num2" class="form-control" placeholder="Ingrese numero 2">
                </div>

             
                <br>
              


                 <label>Seleccione una figura:</label>
                    <div>
                        <input type="radio" name="figura" value="triangulo" [(ngModel)]="figura">
                        <label> Triangulo</label>
                    </div>

                    <div>
                        <input type="radio" name="figura" value="rectangulo" [(ngModel)]="figura">
                        <label>Rectangulo</label>
                    </div>

                      <div>
                        <input type="radio" name="figura" value="circulo" [(ngModel)]="figura">
                        <label>Circulo</label>
                    </div>

                    <div>
                        <input type="radio" name="figura" value="pentagono" [(ngModel)]="figura">
                        <label>Pentagono</label>
                    </div>
                    
                    <br>

                    <button (click)="calcular()" type="button" class="btn btn-primary"> Calcular</button>


 </form>

            </div>

            <div class="col-6">

                <h2>El área de tu figura es: {{resultado}}</h2>

            </div>

        </div>
    </div>
</body>
</html>
