<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="raw">
           <div class="col-6">
             <form action="">
                <div class="form-group pt-4">
                    <h2>INICIO DE SESIÓN</h2>
                    <label for="usuario">Usuario: </label>
                    <input [(ngModel)]="usuario" name="usuario" type="text" id="usuario" class="form-control" placeholder="Ingrese su usuario">
                </div>
                <div class="form-group pt-4">

                    <label for="contra">Contraseña: </label>
                    <input [(ngModel)]="contra" type="text" id="contra" name="contra" class="form-control" placeholder="Ingrese su contraseña">
                </div>

             
                <br>
              


                 
                    <br>

                    <button (click)="inicio()" type="button" class="btn btn-primary"> Iniciar Sesión</button>


 </form>

            </div>

            <div class="col-6">

                <h2> {{resultado}}</h2>

            </div>

        </div>
    </div>
</body>
</html>
